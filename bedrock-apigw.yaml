AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  BedrockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref AWS::StackName
      Runtime: python3.12
      Handler: index.handler
      InlineCode: |
        import json
        import boto3
        
        bedrock_runtime = boto3.client('bedrock-runtime')
        modelId = "jp.amazon.nova-2-lite-v1:0"
        
        def handler(event, context):
            params = event.get('queryStringParameters') or {}
            text = params.get('text', 'こんにちは')
            
            response = bedrock_runtime.converse(
                modelId=modelId,
                messages = [{
                  "role": "user",
                  "content": [{"text": text}],
                }],
                inferenceConfig = {
                  "maxTokens": 2048,
                  "temperature": 0
                }
            )
            
            return {
                'statusCode': 200,
                'body': response["output"]["message"]["content"][0]["text"]
            }
      Policies:
        - Statement:
          - Effect: Allow
            Action: 
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: '*'
      Events:
        Api:
          Type: Api
          Properties:
            Path: /converse
            Method: get

  BedrockStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-stream'
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      InlineCode: |
        const { BedrockRuntimeClient, ConverseStreamCommand } = require("@aws-sdk/client-bedrock-runtime");
        
        const client = new BedrockRuntimeClient();
        const modelId = "jp.amazon.nova-2-lite-v1:0";
        
        exports.handler = awslambda.streamifyResponse(async (event, responseStream) => {
          const metadata = {
            statusCode: 200,
            headers: {
              "Content-Type": "text/plain; charset=utf-8"
            }
          };
          
          responseStream = awslambda.HttpResponseStream.from(responseStream, metadata);
          
          try {
            const text = event.queryStringParameters?.text || "こんにちは";
            
            const command = new ConverseStreamCommand({
              modelId,
              messages: [{ role: "user", content: [{ text }] }],
              inferenceConfig: { maxTokens: 2048, temperature: 0 }
            });
            
            const response = await client.send(command);
            
            for await (const chunk of response.stream) {
              if (chunk.contentBlockDelta?.delta?.text) {
                responseStream.write(chunk.contentBlockDelta.delta.text);
              }
            }
          } catch (error) {
            responseStream.write(`Error: ${error.message}`);
          }
          
          responseStream.end();
        });
      Policies:
        - Statement:
          - Effect: Allow
            Action: 
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: '*'

  StreamResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ServerlessRestApi
      ParentId: !GetAtt ServerlessRestApi.RootResourceId
      PathPart: stream

  StreamMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ServerlessRestApi
      ResourceId: !Ref StreamResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${BedrockStreamFunction.Arn}/response-streaming-invocations'
        IntegrationResponses:
          - StatusCode: 200
        ResponseTransferMode: STREAM

  StreamPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BedrockStreamFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ServerlessRestApi}/*/*'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - StreamMethod
    Properties:
      RestApiId: !Ref ServerlessRestApi
      StageName: Prod

Outputs:
  InvokeUrl:
    Description: "Converse API URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/converse?text=Hello"
  
  StreamUrl:
    Description: "Converse Stream API URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/stream?text=Hello"
